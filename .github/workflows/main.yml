name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync LeetCode Solutions
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          leetcode_session: ${{ secrets.LEETCODE_SESSION }}
          destination_folder: 'leetcode'
